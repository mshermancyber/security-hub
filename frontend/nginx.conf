# Shared proxy + SPA config for both the HTTP and HTTPS server blocks.
# The host maps Docker → published ports:
#   port 80  in container → SECHUB_HTTP_PORT  (default 80)  on host
#   port 443 in container → SECHUB_HTTPS_PORT (default 443) on host

# --- common security headers (applied to every response in both servers) ---
#
# CSP: same-origin scripts and connects, allow inline styles (Tailwind),
# allow Google Fonts CSS/font, allow data: imgs (favicons/inline), allow
# ws:/wss: connect for the live event bus. frame-ancestors: 'none' blocks
# clickjacking even where X-Frame-Options is unsupported.
map $sent_http_content_type $sechub_csp {
    # Tightened from earlier revision:
    #   - img-src no longer accepts arbitrary https hosts (drops a pixel-exfil vector);
    #   - connect-src is same-origin only (the WebSocket bus opens ws/wss back to $host);
    #   - object-src and frame-src explicitly disabled.
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

# Plain HTTP server — auto-redirect to HTTPS unless SECHUB_ALLOW_HTTP=1.
# Healthcheck stays on HTTP so Docker healthchecks don't need to deal
# with the self-signed cert.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # API + /m must reach the backend even over HTTP so curl-style integrations
    # work without enforcing TLS in a docker-internal context.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;

        add_header Content-Security-Policy $sechub_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /m {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   User-Agent $http_user_agent;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /m is also where the desktop opt-out cookie is set; the page
        # must not be cached by any intermediate.
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Browser-loaded pages: redirect to HTTPS so first-visit isn't silently downgrade.
    location / {
        return 301 https://$host:$server_port$request_uri;
    }
}

# HTTPS server (uses cert at /etc/nginx/certs/{cert.pem,key.pem})
# The entrypoint generates a self-signed cert on first boot if none is mounted.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Modern Mozilla intermediate cipher list (Sep 2024). Drops 3DES, RC4,
    # CBC-mode ciphers, and any AEAD variants no longer recommended.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $sechub_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /m {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   User-Agent $http_user_agent;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # SPA shell. Mobile UAs are 302-redirected to /m by the backend
    # MobileRedirectMiddleware; for that to work the backend must see
    # every GET / request, so proxy / through to the backend instead of
    # serving index.html straight from nginx. The backend either returns
    # the redirect or (on a desktop UA / opt-out) passes through to the
    # SPA index served by FastAPI's static handling.
    #
    # NOTE: the current deployment serves the built SPA via `npm run dev`
    # (Vite) — nginx isn't actually used in dev. Production deployers
    # who DO use nginx should either (a) replicate the UA check in nginx
    # via a `map $http_user_agent $is_mobile { ... }` block + an `if` in
    # `location = /`, or (b) configure nginx to proxy / to the backend
    # and let MobileRedirectMiddleware handle it. Keeping the SPA-from-
    # nginx behavior for now and relying on the client-side redirect in
    # main.tsx — the server check is then a fallback for /api/health
    # callers etc.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
